<!DOCTYPE html><html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#F8F3FF" />
  <title>The End | For My Dimple Di ❤️</title>  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&family=Playfair+Display:wght@600;700&family=Caveat:wght@500;700&display=swap" rel="stylesheet">  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/animations.css">  <style>
    :root{
      --bg-a:#F8F3FF;
      --bg-b:#FFF7FC;
      --bg-c:#F5FBFF;
      --glass:rgba(255,255,255,.58);
      --glass-2:rgba(255,255,255,.76);
      --line:rgba(186,160,214,.18);
      --text:#2E2741;
      --muted:#6F6681;
      --accent:#BFA3E8;
      --accent-2:#8EC9F9;
      --accent-3:#F4B9D2;
      --shadow:0 18px 48px rgba(61,42,90,.10);
      --shadow-2:0 26px 66px rgba(61,42,90,.14);
      --radius:28px;
      --ease:cubic-bezier(.2,.9,.2,1);
    }

    *{ box-sizing:border-box; }
    html,body{
      margin:0;
      width:100%;
      height:100%;
      overflow:hidden;
      background:
        radial-gradient(circle at 16% 18%, rgba(255,193,217,.24) 0%, rgba(255,193,217,0) 24%),
        radial-gradient(circle at 84% 16%, rgba(142,201,249,.18) 0%, rgba(142,201,249,0) 26%),
        radial-gradient(circle at 50% 80%, rgba(191,163,232,.14) 0%, rgba(191,163,232,0) 30%),
        linear-gradient(160deg, var(--bg-a), var(--bg-b) 48%, var(--bg-c));
      color:var(--text);
      font-family:'Poppins', sans-serif;
      -webkit-font-smoothing:antialiased;
      text-rendering:optimizeLegibility;
    }

    #end-page{
      position:relative;
      width:100%;
      height:100dvh;
      height:100vh;
      overflow:hidden;
      isolation:isolate;
    }

    #sky-canvas{
      position:absolute;
      inset:0;
      width:100%;
      height:100%;
      z-index:1;
      pointer-events:none;
    }

    .mist{
      position:absolute;
      border-radius:50%;
      filter:blur(56px);
      opacity:.56;
      z-index:2;
      pointer-events:none;
      will-change:transform;
    }
    .mist.one{
      width:44vw;
      height:44vw;
      top:-10vw;
      left:-8vw;
      background:radial-gradient(circle, rgba(255,193,217,.52) 0%, rgba(255,193,217,0) 68%);
      animation: drift1 22s ease-in-out infinite;
    }
    .mist.two{
      width:50vw;
      height:50vw;
      top:6vw;
      right:-12vw;
      background:radial-gradient(circle, rgba(142,201,249,.42) 0%, rgba(142,201,249,0) 68%);
      animation: drift2 26s ease-in-out infinite;
    }
    .mist.three{
      width:62vw;
      height:62vw;
      bottom:-20vw;
      left:50%;
      transform:translateX(-50%);
      background:radial-gradient(circle, rgba(191,163,232,.26) 0%, rgba(191,163,232,0) 70%);
      animation: drift3 18s ease-in-out infinite;
    }

    @keyframes drift1{
      0%,100%{ transform:translate(0,0) scale(1); }
      50%{ transform:translate(3vw,4vw) scale(1.08); }
    }
    @keyframes drift2{
      0%,100%{ transform:translate(0,0) scale(1); }
      50%{ transform:translate(-4vw,3vw) scale(1.06); }
    }
    @keyframes drift3{
      0%,100%{ transform:translate(-50%,0) scale(.98); }
      50%{ transform:translate(-50%,-2vw) scale(1.04); }
    }

    #star-layer{
      position:absolute;
      inset:0;
      z-index:3;
      pointer-events:none;
      overflow:hidden;
    }

    .star{
      position:absolute;
      border-radius:50%;
      background:rgba(78,58,102,.52);
      box-shadow:0 0 8px rgba(78,58,102,.16);
      opacity:.10;
      animation: twinkle var(--twinkle, 4.4s) ease-in-out infinite;
      animation-delay:var(--delay, 0s);
    }
    @keyframes twinkle{
      0%,100%{ opacity:.12; transform:scale(.72); }
      50%{ opacity:.55; transform:scale(1.08); }
    }

    .shooting-star{
      position:absolute;
      width:2px;
      height:2px;
      border-radius:50%;
      background:#fff;
      box-shadow:0 0 10px rgba(255,255,255,.95);
      z-index:4;
      opacity:0;
      pointer-events:none;
    }
    .shooting-star::before{
      content:'';
      position:absolute;
      top:50%;
      right:0;
      width:120px;
      height:1.5px;
      transform:translateY(-50%);
      background:linear-gradient(to left, rgba(255,255,255,.95), rgba(255,255,255,0));
    }
    @keyframes shootAcross{
      0%{ transform:translate(0,0); opacity:0; }
      10%{ opacity:1; }
      100%{ transform:translate(var(--sx), var(--sy)); opacity:0; }
    }

    .memory-cloud{
      position:absolute;
      inset:0;
      z-index:5;
      pointer-events:none;
    }

    .memory-card{
      position:absolute;
      width:clamp(92px, 20vw, 126px);
      aspect-ratio: 1 / 1.22;
      border-radius:22px;
      overflow:hidden;
      background:var(--glass);
      border:1px solid rgba(255,255,255,.55);
      box-shadow:var(--shadow);
      backdrop-filter:blur(10px);
      -webkit-backdrop-filter:blur(10px);
      transform:rotate(var(--rot, 0deg));
      animation: floatCard var(--float, 8s) ease-in-out infinite;
      animation-delay:var(--float-delay, 0s);
    }

    .memory-card::after{
      content:'';
      position:absolute;
      inset:0;
      background:linear-gradient(to top, rgba(255,255,255,.30), rgba(255,255,255,0) 46%);
      pointer-events:none;
      z-index:2;
    }

    .memory-photo{
      position:absolute;
      inset:0;
      width:100%;
      height:100%;
      object-fit:cover;
      transform:scale(1.04);
      z-index:0;
      filter:saturate(1.03) contrast(1.01);
    }

    .memory-overlay{
      position:absolute;
      inset:0;
      background:
        linear-gradient(to top, rgba(38,28,54,.52) 0%, rgba(38,28,54,.12) 52%, rgba(255,255,255,0) 100%),
        radial-gradient(circle at 50% 18%, rgba(255,255,255,.16) 0%, rgba(255,255,255,0) 42%);
      z-index:1;
      pointer-events:none;
    }

    .memory-inner{
      position:absolute;
      left:10px;
      right:10px;
      bottom:10px;
      z-index:3;
      color:#fff;
    }

    .memory-title{
      margin:0 0 2px;
      font-size:10px;
      letter-spacing:1.2px;
      text-transform:uppercase;
      color:rgba(255,255,255,.82);
      text-shadow:0 2px 8px rgba(0,0,0,.18);
    }

    .memory-note{
      margin:0;
      font-family:'Caveat', cursive;
      font-size:24px;
      line-height:1.02;
      text-shadow:0 2px 10px rgba(0,0,0,.24);
    }

    .memory-badge{
      position:absolute;
      top:9px;
      left:9px;
      z-index:3;
      width:26px;
      height:26px;
      border-radius:50%;
      display:grid;
      place-items:center;
      background:rgba(255,255,255,.24);
      color:#fff;
      font-size:14px;
      box-shadow:0 8px 20px rgba(0,0,0,.14);
      backdrop-filter:blur(8px);
      -webkit-backdrop-filter:blur(8px);
    }

    @keyframes floatCard{
      0%,100%{ transform:translateY(0) rotate(var(--rot, 0deg)); }
      50%{ transform:translateY(-8px) rotate(var(--rot, 0deg)); }
    }

    .content{
      position:relative;
      z-index:10;
      width:min(92vw, 520px);
      height:100%;
      margin:0 auto;
      display:flex;
      flex-direction:column;
      align-items:center;
      justify-content:center;
      text-align:center;
      padding:28px 16px 26px;
    }

    .soft-intro{
      margin:0 0 10px;
      font-size:12px;
      letter-spacing:2px;
      text-transform:uppercase;
      color:#7A6B8D;
      opacity:0;
      animation: fadeInUp .9s var(--ease) forwards;
      animation-delay:.1s;
    }

    .heart-wrap{
      position:relative;
      width:clamp(152px, 40vw, 210px);
      aspect-ratio:1 / .95;
      margin:0 0 14px;
      opacity:0;
      transform:translateY(12px) scale(.98);
      animation: reveal .95s var(--ease) forwards;
      animation-delay:.35s;
    }

    .glow-ring{
      position:absolute;
      inset:-10%;
      border-radius:50%;
      background:radial-gradient(circle, rgba(255,255,255,.66) 0%, rgba(255,255,255,.10) 24%, rgba(191,163,232,.18) 42%, rgba(142,201,249,0) 72%);
      filter:blur(10px);
      opacity:.8;
      animation:pulse 4.8s ease-in-out infinite;
    }
    @keyframes pulse{
      0%,100%{ transform:scale(.96); opacity:.68; }
      50%{ transform:scale(1.05); opacity:1; }
    }

    .heart-svg{
      position:relative;
      z-index:2;
      width:100%;
      height:100%;
      filter:drop-shadow(0 14px 28px rgba(61,42,90,.12));
    }

    .heart-fill{
      fill:url(#heartGrad);
      filter:url(#heartBlur);
      opacity:.88;
      transform-origin:center;
      animation: beat 3.5s ease-in-out infinite;
    }

    .heart-outline{
      fill:none;
      stroke:rgba(122,107,141,.40);
      stroke-width:2.1;
    }

    @keyframes beat{
      0%,100%{ transform:scale(1); }
      45%{ transform:scale(1.03); }
      60%{ transform:scale(.99); }
    }

    .main-title{
      margin:0;
      font-family:'Playfair Display', serif;
      font-size:clamp(28px, 7.6vw, 42px);
      line-height:1.06;
      color:var(--text);
      text-shadow:0 10px 26px rgba(255,255,255,.4);
      opacity:0;
      transform:translateY(12px);
      animation: fadeInUp .95s var(--ease) forwards;
      animation-delay:.72s;
    }

    .story-box{
      width:min(100%, 500px);
      margin-top:16px;
      padding:18px 16px 16px;
      border-radius:var(--radius);
      background:linear-gradient(180deg, rgba(255,255,255,.78), rgba(255,255,255,.58));
      border:1px solid rgba(255,255,255,.72);
      box-shadow:var(--shadow-2);
      backdrop-filter:blur(14px);
      -webkit-backdrop-filter:blur(14px);
      opacity:0;
      transform:translateY(14px);
      animation: fadeInUp 1s var(--ease) forwards;
      animation-delay:1s;
    }

    .story-lines{
      min-height:150px;
      display:flex;
      flex-direction:column;
      justify-content:center;
      gap:10px;
    }

    .story-line{
      margin:0;
      font-family:'Caveat', cursive;
      font-size:clamp(22px, 5.7vw, 30px);
      line-height:1.22;
      color:var(--text);
      white-space:pre-wrap;
    }

    .story-line.dim{
      font-size:clamp(18px, 4.8vw, 24px);
      color:#625774;
    }

    .end-hint-line{
      margin:12px 0 0;
      color:var(--muted);
      font-size:13px;
      letter-spacing:.3px;
      opacity:0;
      transform:translateY(8px);
      transition:opacity 1s var(--ease), transform 1s var(--ease);
    }
    .end-hint-line.show{
      opacity:1;
      transform:translateY(0);
    }

    .replay-wrap{
      margin-top:16px;
      opacity:0;
      transform:translateY(14px);
      pointer-events:none;
      transition:opacity 1s var(--ease), transform 1s var(--ease);
    }
    .replay-wrap.show{
      opacity:1;
      transform:translateY(0);
      pointer-events:auto;
    }

    #replay-btn{
      appearance:none;
      border:none;
      border-radius:999px;
      padding:14px 22px;
      display:inline-flex;
      align-items:center;
      justify-content:center;
      gap:9px;
      background:linear-gradient(135deg, rgba(191,163,232,.18), rgba(142,201,249,.16));
      color:var(--text);
      font:600 15px/1 'Poppins', sans-serif;
      border:1px solid rgba(127,107,165,.14);
      box-shadow:0 14px 34px rgba(61,42,90,.10);
      backdrop-filter:blur(12px);
      -webkit-backdrop-filter:blur(12px);
      cursor:pointer;
      transition:transform .22s ease, box-shadow .22s ease, background .22s ease;
    }

    #replay-btn:hover{
      background:linear-gradient(135deg, rgba(191,163,232,.25), rgba(142,201,249,.22));
      box-shadow:0 16px 40px rgba(61,42,90,.14);
    }

    #replay-btn:active{ transform:scale(.97); }
    #replay-btn svg{ width:16px; height:16px; }

    .mini-note{
      margin:10px 0 0;
      font-size:12px;
      color:#7A6B8D;
    }

    .music-chip{
      position:fixed;
      top:12px;
      right:12px;
      z-index:30;
    }

    .icon-btn{
      width:42px;
      height:42px;
      border:none;
      border-radius:50%;
      display:grid;
      place-items:center;
      background:rgba(255,255,255,.62);
      color:#4F4364;
      box-shadow:0 10px 24px rgba(61,42,90,.08);
      backdrop-filter:blur(12px);
      -webkit-backdrop-filter:blur(12px);
      cursor:pointer;
      transition:transform .2s ease, background .2s ease;
    }

    .icon-btn:hover{ background:rgba(255,255,255,.78); }
    .icon-btn:active{ transform:scale(.96); }

    .fade-overlay{
      position:fixed;
      inset:0;
      z-index:50;
      pointer-events:none;
      opacity:0;
      background:radial-gradient(circle at center, rgba(255,255,255,.62) 0%, rgba(255,255,255,.18) 28%, rgba(255,255,255,0) 64%);
      transition:opacity .8s ease;
    }

    .fade-overlay.show{ opacity:1; }

    @keyframes fadeInUp{
      from{ opacity:0; transform:translateY(12px); }
      to{ opacity:1; transform:translateY(0); }
    }

    @media (max-width:420px){
      .content{ padding:24px 12px 22px; }
      .story-box{ padding:15px 13px 14px; }
      .story-lines{ min-height:136px; }
      #replay-btn{ padding:13px 18px; font-size:14px; }
      .memory-card{ width:96px; }
    }

    @media (prefers-reduced-motion: reduce){
      *, *::before, *::after{
        animation:none !important;
        transition:none !important;
        scroll-behavior:auto !important;
      }
    }
  </style></head>
<body>
  <main id="end-page" class="page">
    <canvas id="sky-canvas" aria-hidden="true"></canvas><div class="mist one" aria-hidden="true"></div>
<div class="mist two" aria-hidden="true"></div>
<div class="mist three" aria-hidden="true"></div>

<div id="star-layer" aria-hidden="true"></div>
<div class="memory-cloud" id="memory-cloud" aria-hidden="true"></div>

<div class="music-chip">
  <button id="music-btn" class="icon-btn" aria-label="Toggle Music">🔊</button>
</div>

<div class="content">
  <p class="soft-intro">A soft goodbye</p>

  <div class="heart-wrap">
    <div class="glow-ring"></div>
    <svg class="heart-svg" viewBox="0 0 300 270" role="img" aria-label="Glowing heart">
      <defs>
        <linearGradient id="heartGrad" x1="0%" y1="0%" x2="100%" y2="100%">
          <stop offset="0%" stop-color="#8EC9F9"/>
          <stop offset="50%" stop-color="#BFA3E8"/>
          <stop offset="100%" stop-color="#F4B9D2"/>
        </linearGradient>
        <filter id="heartBlur" x="-30%" y="-30%" width="160%" height="160%">
          <feGaussianBlur stdDeviation="14"></feGaussianBlur>
        </filter>
      </defs>
      <path class="heart-fill" d="M150 248C134 233 85 194 63 164C41 134 34 113 34 93C34 62 58 38 89 38C112 38 131 51 150 74C169 51 188 38 211 38C242 38 266 62 266 93C266 113 259 134 237 164C215 194 166 233 150 248Z"></path>
      <path class="heart-outline" d="M150 248C134 233 85 194 63 164C41 134 34 113 34 93C34 62 58 38 89 38C112 38 131 51 150 74C169 51 188 38 211 38C242 38 266 62 266 93C266 113 259 134 237 164C215 194 166 233 150 248Z"></path>
    </svg>
  </div>

  <h1 class="main-title" id="end-title">A Soft Goodbye</h1>

  <section class="story-box">
    <div class="story-lines" id="story-lines" aria-live="polite"></div>
    <p class="end-hint-line" id="end-hint">Some memories never fade.</p>

    <div class="replay-wrap" id="replay-wrap">
      <button id="replay-btn">
        <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
          <path d="M4 4v5h5M20 20v-5h-5M4.5 9a8 8 0 0114.3-3M19.5 15a8 8 0 01-14.3 3" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
        Ek Baar Aur Dekho
      </button>
      <p class="mini-note">Har yaad dil me hi rehti hai.</p>
    </div>
  </section>
</div>

<div class="fade-overlay" id="fade-overlay" aria-hidden="true"></div>

<audio id="bg-music" src="assets/music/end.mp3" loop preload="auto"></audio>

<script src="js/app.js"></script>
<script>
  (function () {
    var reducedMotion = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    var starLayer = document.getElementById('star-layer');
    var memoryCloud = document.getElementById('memory-cloud');
    var storyLines = document.getElementById('story-lines');
    var endHint = document.getElementById('end-hint');
    var replayWrap = document.getElementById('replay-wrap');
    var replayBtn = document.getElementById('replay-btn');
    var fadeOverlay = document.getElementById('fade-overlay');

    var audio = document.getElementById('bg-music');
    var musicBtn = document.getElementById('music-btn');
    var storageKey = 'dimple_music_muted';
    var muted = localStorage.getItem(storageKey) === 'true';

    function updateMusicIcon() {
      musicBtn.textContent = muted ? '🔇' : '🔊';
    }

    function tryPlay() {
      if (!muted) {
        audio.play().catch(function () {});
      }
    }

    function fadeAudioTo(targetVolume, duration) {
      if (!audio) return;
      var startVolume = audio.volume;
      var start = performance.now();
      function tick(now) {
        var t = Math.min(1, (now - start) / duration);
        audio.volume = startVolume + (targetVolume - startVolume) * t;
        if (t < 1) requestAnimationFrame(tick);
      }
      requestAnimationFrame(tick);
    }

    audio.volume = 0.42;
    audio.muted = muted;
    updateMusicIcon();
    tryPlay();

    musicBtn.addEventListener('click', function () {
      muted = !muted;
      audio.muted = muted;
      localStorage.setItem(storageKey, String(muted));
      if (!muted) {
        audio.volume = 0.42;
        audio.play().catch(function () {});
      }
      updateMusicIcon();
    });

    document.addEventListener('pointerdown', function firstInteract() {
      tryPlay();
      document.removeEventListener('pointerdown', firstInteract, true);
    }, { once: true, capture: true });

    function createStars() {
      if (reducedMotion) return;
      var count = 76;
      for (var i = 0; i < count; i++) {
        var s = document.createElement('span');
        s.className = 'star';
        var size = 1 + Math.random() * 2.1;
        s.style.width = size + 'px';
        s.style.height = size + 'px';
        s.style.left = (Math.random() * 100) + 'vw';
        s.style.top = (Math.random() * 100) + 'vh';
        s.style.setProperty('--twinkle', (2.8 + Math.random() * 4.8) + 's');
        s.style.setProperty('--delay', (Math.random() * 5) + 's');
        starLayer.appendChild(s);
      }
    }

    function spawnShootingStar() {
      if (reducedMotion) return;
      var star = document.createElement('div');
      star.className = 'shooting-star';
      var startX = Math.random() * window.innerWidth * 0.72 + window.innerWidth * 0.14;
      var startY = Math.random() * window.innerHeight * 0.34 + window.innerHeight * 0.08;
      var angle = (Math.random() * 18 + 18) * Math.PI / 180;
      var distance = 240 + Math.random() * 240;
      var sx = Math.cos(angle) * distance * -1;
      var sy = Math.sin(angle) * distance;
      star.style.left = startX + 'px';
      star.style.top = startY + 'px';
      star.style.setProperty('--sx', sx + 'px');
      star.style.setProperty('--sy', sy + 'px');
      star.style.transform = 'rotate(' + (angle * 180 / Math.PI) + 'deg)';
      star.style.animation = 'shootAcross ' + (1.05 + Math.random() * 0.55) + 's ease-out forwards';
      document.getElementById('end-page').appendChild(star);
      setTimeout(function () { star.remove(); }, 2000);
    }

    function scheduleShootingStars() {
      if (reducedMotion) return;
      (function loop() {
        var delay = 3000 + Math.random() * 4300;
        setTimeout(function () {
          spawnShootingStar();
          loop();
        }, delay);
      })();
    }

    function createMemoryCards() {
      var cards = [
        { img: 'assets/image/didi.jpg', title: 'Memory 01', note: 'hasi', x: '4%',  y: '18%', rot: '-7deg', float: '7.0s', pos: 'center 18%' },
        { img: 'assets/image/didi.jpg', title: 'Memory 02', note: 'yaad', x: '74%', y: '16%', rot: '8deg',  float: '7.4s', pos: 'center 36%' },
        { img: 'assets/image/didi.jpg', title: 'Memory 03', note: 'pal',  x: '8%',  y: '68%', rot: '7deg',  float: '6.8s', pos: 'center 62%' },
        { img: 'assets/image/didi.jpg', title: 'Memory 04', note: 'dil',  x: '72%', y: '67%', rot: '-7deg', float: '7.2s', pos: 'center 82%' }
      ];

      cards.forEach(function (c, i) {
        var card = document.createElement('div');
        card.className = 'memory-card';
        card.style.left = c.x;
        card.style.top = c.y;
        card.style.setProperty('--rot', c.rot);
        card.style.setProperty('--float', c.float);
        card.style.setProperty('--float-delay', (i * .55) + 's');

        var img = document.createElement('img');
        img.className = 'memory-photo';
        img.src = c.img;
        img.alt = 'Dimple Di memory photo';
        img.style.objectPosition = c.pos;
        img.onerror = function () { this.style.display = 'none'; };

        var overlay = document.createElement('div');
        overlay.className = 'memory-overlay';

        var badge = document.createElement('div');
        badge.className = 'memory-badge';
        badge.textContent = '✦';

        var inner = document.createElement('div');
        inner.className = 'memory-inner';

        var title = document.createElement('p');
        title.className = 'memory-title';
        title.textContent = c.title;

        var note = document.createElement('p');
        note.className = 'memory-note';
        note.textContent = c.note;

        inner.appendChild(title);
        inner.appendChild(note);

        card.appendChild(img);
        card.appendChild(overlay);
        card.appendChild(badge);
        card.appendChild(inner);
        memoryCloud.appendChild(card);
      });
    }

    function wait(ms) {
      return new Promise(function (resolve) {
        setTimeout(resolve, ms);
      });
    }

    async function typeLines() {
      var lines = [
        { text: 'Bas itna hi kehna tha...', dim: false },
        { text: 'Shayad har baat lafzon me nahi aati.', dim: true },
        { text: 'Lekin har yaad apna rang chhod jaati hai.', dim: true },
        { text: 'Aur tum un yaadon me se ho jo kabhi halka nahi padta.', dim: true },
        { text: 'Thank you for staying here with me.', dim: false }
      ];

      for (var i = 0; i < lines.length; i++) {
        var p = document.createElement('p');
        p.className = 'story-line' + (lines[i].dim ? ' dim' : '');
        storyLines.appendChild(p);

        var chars = lines[i].text.split('');
        for (var j = 0; j < chars.length; j++) {
          p.textContent += chars[j];
          if (!reducedMotion) {
            await wait(20 + Math.random() * 14);
          }
        }

        if (!reducedMotion) {
          await wait(i === 0 ? 650 : 850);
        }
      }

      endHint.classList.add('show');

      if (!muted) {
        fadeAudioTo(0.05, 3600);
      }

      if (!reducedMotion) {
        await wait(1000);
      }

      replayWrap.classList.add('show');
    }

    function bindReplay() {
      replayBtn.addEventListener('click', function () {
        fadeOverlay.classList.add('show');
        if (!muted) {
          fadeAudioTo(0, 650);
        }
        setTimeout(function () {
          window.location.href = 'index.html';
        }, 700);
      });
    }

    function init() {
      createStars();
      createMemoryCards();
      scheduleShootingStars();
      bindReplay();
      typeLines();
    }

    init();
  })();
</script>

  </main>
</body>
</html>
