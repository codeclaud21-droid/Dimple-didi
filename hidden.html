<!DOCTYPE html><html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#0B0A14">
<title>Hidden | For My Dimple Di ❤️</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&family=Playfair+Display:wght@600;700&family=Caveat:wght@500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="css/animations.css">
<style>
  /* ============ Hidden Section — Mirror Message ============ */
  #hidden-page{
    position: relative;
    height: 100vh;
    height: 100dvh;
    overflow: hidden;
    background: radial-gradient(ellipse at 50% 30%, #241A38 0%, #140F22 45%, #0B0A14 100%);
  }
  #hidden-page .top-bar{ z-index: 60; }
  #hidden-page .top-bar .icon-btn svg path{ stroke:#fff; }
  #hidden-page #music-btn{ color:#fff; }.glow-blob{ position: absolute; border-radius: 50%; filter: blur(70px); mix-blend-mode: screen; opacity: 0.35; z-index: 1; will-change: transform; } .glow-blob.g1{ width: 75vw; height: 75vw; top: -24vw; left: -20vw; background: radial-gradient(circle, #9E7FFF 0%, rgba(158,127,255,0) 70%); animation: blobDrift1 26s ease-in-out infinite; } .glow-blob.g2{ width: 80vw; height: 80vw; bottom: -28vw; right: -22vw; background: radial-gradient(circle, #FFB8DE 0%, rgba(255,184,222,0) 70%); animation: blobDrift2 32s ease-in-out infinite; } @keyframes blobDrift1{ 0%,100%{ transform: translate(0,0) scale(1); } 50%{ transform: translate(3vw,4vw) scale(1.1); } } @keyframes blobDrift2{ 0%,100%{ transform: translate(0,0) scale(1); } 50%{ transform: translate(-4vw,-3vw) scale(1.08); } }

.dust-mote{ position: absolute; width: 3px; height: 3px; border-radius: 50%; background: #fff; box-shadow: 0 0 6px 2px rgba(255,255,255,0.55); z-index: 2; opacity: 0; pointer-events: none; } @keyframes moteFloat{ 0%{ transform: translateY(0) scale(0.6); opacity:0; } 12%{ opacity: 0.7; } 100%{ transform: translateY(-160px) scale(1); opacity:0; } }

#reveal-content{ position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; z-index: 5; padding: 0 12vw; } .ornament-frame{ position: relative; text-align: center; max-width: 420px; } .ornament-glow{ position: absolute; left: 50%; top: 50%; width: 120%; height: 140%; transform: translate(-50%,-50%); background: radial-gradient(ellipse, rgba(255,214,236,0.28) 0%, rgba(158,127,255,0.14) 45%, rgba(0,0,0,0) 72%); z-index: -1; pointer-events: none; } .ornament-svg{ width: 46px; height: 46px; margin: 0 auto 14px; opacity: 0.9; } .ornament-svg path, .ornament-svg circle{ stroke: #FFD6EC; fill: none; stroke-width: 1.3; } #message-title{ font-family: 'Playfair Display', serif; font-weight: 700; font-size: clamp(22px, 6vw, 30px); color: #FFF6FB; margin: 0 0 10px; text-shadow: 0 0 22px rgba(255,214,236,0.5); } #message-body{ font-family: 'Caveat', cursive; font-weight: 500; font-size: clamp(20px, 5.6vw, 26px); line-height: 1.55; color: #EDE3FF; text-shadow: 0 0 16px rgba(158,127,255,0.35); } .ornament-svg.bottom{ margin: 16px auto 0; transform: rotate(180deg); }

#fog-canvas{ position: absolute; inset: 0; z-index: 10; display: block; touch-action: none; transition: opacity 1.2s ease; }

#wipe-hint{ position: absolute; left: 50%; top: 50%; transform: translate(-50%,-50%); z-index: 15; display: flex; flex-direction: column; align-items: center; gap: 10px; pointer-events: none; opacity: 0; animation: hintFadeIn 1s ease 0.6s forwards; } #wipe-hint .hint-icon{ width: 34px; height: 34px; color: rgba(255,255,255,0.85); animation: hintSwipe 1.8s ease-in-out infinite; } #wipe-hint .hint-text{ font-family: 'Poppins', sans-serif; font-size: 13px; letter-spacing: 0.4px; color: rgba(255,255,255,0.75); } @keyframes hintFadeIn{ to{ opacity: 1; } } @keyframes hintSwipe{ 0%,100%{ transform: translateX(-14px); opacity: 0.55; } 50%{ transform: translateX(14px); opacity: 1; } } #wipe-hint.hide{ animation: none; opacity: 0; transition: opacity 0.4s ease; }

.reveal-spark{ position: absolute; width: 4px; height: 4px; border-radius: 50%; background: #fff; box-shadow: 0 0 8px 3px rgba(255,214,236,0.9); z-index: 20; pointer-events: none; opacity: 0; } @keyframes sparkBurst{ 0%{ transform: translate(0,0) scale(0.4); opacity: 0; } 18%{ opacity: 1; } 100%{ transform: translate(var(--dx), var(--dy)) scale(1); opacity: 0; } }

.hidden-continue-wrap{ position: absolute; bottom: 42px; left: 0; right: 0; display: flex; justify-content: center; z-index: 30; opacity: 0; transform: translateY(14px); pointer-events: none; transition: opacity 0.9s ease, transform 0.9s ease; } .hidden-continue-wrap.show{ opacity: 1; transform: translateY(0); pointer-events: auto; } </style>

</head>
<body>
<main id="hidden-page" class="page">  <div class="glow-blob g1"></div>
  <div class="glow-blob g2"></div>  <!-- ===== content hidden behind the fog ===== -->  <div id="reveal-content">
    <div class="ornament-frame">
      <div class="ornament-glow"></div>
      <svg class="ornament-svg" viewBox="0 0 46 46"><path d="M23 4 L23 42 M6 23 L40 23" /><circle cx="23" cy="23" r="15"/></svg><!-- ✏️ YAHAN APNA MESSAGE LIKHEIN — neeche title aur body ko apne text se replace karein -->
  <h2 id="message-title">Arz Kiya Hai...</h2>
  <p id="message-body">Kisi ke zakhm pe chahat se patti kaun bandhega...<br>
  Kisi ke zakhm pe chahat se patti kaun bandhega...<br>
  <br>
  Agar bahane nahi hongi...<br>
  to Rakhi kaun bandhega? ❤️🥹</p>
  <!-- ✏️ Message replace karne ke baad ye comment hata sakte hain -->

  <svg class="ornament-svg bottom" viewBox="0 0 46 46"><path d="M23 4 L23 42 M6 23 L40 23" /><circle cx="23" cy="23" r="15"/></svg>
</div>

  </div>  <!-- ===== fog layer user wipes away ===== --><canvas id="fog-canvas"></canvas>

  <div id="wipe-hint">
    <svg class="hint-icon" viewBox="0 0 24 24" fill="none">
      <path d="M9 8.5V4.5C9 3.67 9.67 3 10.5 3s1.5.67 1.5 1.5V11" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/>
      <path d="M12 11V3.8c0-.83.67-1.5 1.5-1.5S15 2.97 15 3.8V11" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/>
      <path d="M15 11V5.3c0-.83.67-1.5 1.5-1.5S18 4.47 18 5.3V13" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/>
      <path d="M6 12.5V9c0-.83.67-1.5 1.5-1.5S9 8.17 9 9v7.5c0 3.6 2.9 6.5 6.5 6.5h1c3.31 0 6-2.69 6-6v-3.5c0-.83-.67-1.5-1.5-1.5S19.5 12.17 19.5 13" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
    </svg>
    <span class="hint-text">ungli se shishe ko saaf karo</span>
  </div>  <div class="top-bar">
    <button id="back-btn" class="icon-btn" aria-label="Back">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none">
        <path d="M15 18l-6-6 6-6" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
    </button>
    <button id="music-btn" class="icon-btn" aria-label="Toggle Music">🔊</button>
  </div>  <div class="hidden-continue-wrap" id="continue-wrap">
    <button id="continue-btn" class="primary-btn">Aage Badhiye</button>
  </div></main><audio id="bg-music" src="assets/music/hidden.mp3" loop></audio>

<script src="js/app.js"></script><script>
(function(){
  var page = document.getElementById('hidden-page');

  // ================= Dust motes ambience =================
  function spawnMote(){
    var d = document.createElement('div');
    d.className = 'dust-mote';
    var x = Math.random() * window.innerWidth;
    var y = window.innerHeight * (0.55 + Math.random()*0.4);
    d.style.left = x + 'px';
    d.style.top = y + 'px';
    d.style.animation = 'moteFloat ' + (5 + Math.random()*3) + 's ease-out forwards';
    page.appendChild(d);
    setTimeout(function(){ d.remove(); }, 8200);
  }
  setInterval(spawnMote, 900);
  spawnMote();

  // ================= Fog canvas: paint + wipe-to-reveal =================
  var canvas = document.getElementById('fog-canvas');
  var ctx = canvas.getContext('2d');
  var W, H, DPR;
  var revealed = false;
  var hint = document.getElementById('wipe-hint');
  var hintHidden = false;

  function resize(){
    DPR = Math.min(window.devicePixelRatio || 1, 2);
    W = window.innerWidth;
    H = window.innerHeight;
    canvas.width = W * DPR;
    canvas.height = H * DPR;
    canvas.style.width = W + 'px';
    canvas.style.height = H + 'px';
    ctx.setTransform(DPR,0,0,DPR,0,0);
    paintFog();
  }

  function paintFog(){
    ctx.globalCompositeOperation = 'source-over';
    ctx.clearRect(0,0,W,H);
    var base = ctx.createLinearGradient(0,0,0,H);
    base.addColorStop(0, 'rgba(214,210,225,0.94)');
    base.addColorStop(1, 'rgba(190,186,204,0.94)');
    ctx.fillStyle = base;
    ctx.fillRect(0,0,W,H);
    for (var i = 0; i < 34; i++){
      var bx = Math.random()*W, by = Math.random()*H;
      var br = 60 + Math.random()*120;
      var g = ctx.createRadialGradient(bx,by,0,bx,by,br);
      var shade = 200 + Math.random()*35;
      g.addColorStop(0, 'rgba('+shade+','+shade+','+(shade+8)+',0.5)');
      g.addColorStop(1, 'rgba('+shade+','+shade+','+(shade+8)+',0)');
      ctx.fillStyle = g;
      ctx.beginPath();
      ctx.arc(bx,by,br,0,Math.PI*2);
      ctx.fill();
    }
  }

  window.addEventListener('resize', resize);
  resize();

  var drawing = false;
  var lastX = null, lastY = null;
  var BRUSH_R = Math.max(38, Math.min(60, W * 0.11));

  function eraseAt(x, y){
    var g = ctx.createRadialGradient(x,y,0,x,y,BRUSH_R);
    g.addColorStop(0, 'rgba(0,0,0,1)');
    g.addColorStop(0.7, 'rgba(0,0,0,0.85)');
    g.addColorStop(1, 'rgba(0,0,0,0)');
    ctx.globalCompositeOperation = 'destination-out';
    ctx.fillStyle = g;
    ctx.beginPath();
    ctx.arc(x,y,BRUSH_R,0,Math.PI*2);
    ctx.fill();
  }

  function eraseStroke(x0,y0,x1,y1){
    var dist = Math.hypot(x1-x0, y1-y0);
    var steps = Math.max(1, Math.floor(dist / (BRUSH_R*0.35)));
    for (var i = 0; i <= steps; i++){
      var t = i/steps;
      eraseAt(x0 + (x1-x0)*t, y0 + (y1-y0)*t);
    }
  }

  function pointerPos(e){
    if (e.touches && e.touches.length) return { x: e.touches[0].clientX, y: e.touches[0].clientY };
    return { x: e.clientX, y: e.clientY };
  }

  function onDown(e){
    if (revealed) return;
    drawing = true;
    if (!hintHidden){ hintHidden = true; hint.classList.add('hide'); }
    var p = pointerPos(e);
    lastX = p.x; lastY = p.y;
    eraseAt(p.x, p.y);
  }
  function onMove(e){
    if (!drawing || revealed) return;
    var p = pointerPos(e);
    eraseStroke(lastX, lastY, p.x, p.y);
    lastX = p.x; lastY = p.y;
  }
  function onUp(){ drawing = false; }

  canvas.addEventListener('pointerdown', onDown);
  canvas.addEventListener('pointermove', onMove);
  window.addEventListener('pointerup', onUp);
  canvas.addEventListener('touchstart', onDown, {passive:true});
  canvas.addEventListener('touchmove', onMove, {passive:true});
  window.addEventListener('touchend', onUp);

  var GRID_X = 12, GRID_Y = 18;
  function checkProgress(){
    if (revealed) return;
    var cleared = 0, total = GRID_X*GRID_Y;
    for (var i = 0; i < GRID_X; i++){
      for (var j = 0; j < GRID_Y; j++){
        var px = Math.floor((i+0.5) * W / GRID_X);
        var py = Math.floor((j+0.5) * H / GRID_Y);
        try{
          var data = ctx.getImageData(px*DPR, py*DPR, 1, 1).data;
          if (data[3] < 60) cleared++;
        }catch(e){ /* ignore */ }
      }
    }
    if (cleared / total >= 0.6){
      fullyReveal();
    }
  }
  var progressTimer = setInterval(checkProgress, 350);

  function fullyReveal(){
    if (revealed) return;
    revealed = true;
    clearInterval(progressTimer);
    canvas.style.opacity = '0';
    setTimeout(function(){ canvas.style.display = 'none'; }, 1250);
    spawnSparkleBurst();
    playChime();
    playHiddenSong();
    setTimeout(function(){
      document.getElementById('continue-wrap').classList.add('show');
    }, 1900);
  }

  function spawnSparkleBurst(){
    var cx = W/2, cy = H/2;
    for (var k = 0; k < 22; k++){
      (function(k){
        setTimeout(function(){
          var s = document.createElement('div');
          s.className = 'reveal-spark';
          var angle = Math.random()*Math.PI*2;
          var dist = 60 + Math.random()*140;
          s.style.left = cx + 'px';
          s.style.top = cy + 'px';
          s.style.setProperty('--dx', Math.cos(angle)*dist + 'px');
          s.style.setProperty('--dy', Math.sin(angle)*dist + 'px');
          s.style.animation = 'sparkBurst ' + (0.9 + Math.random()*0.6) + 's ease-out forwards';
          page.appendChild(s);
          setTimeout(function(){ s.remove(); }, 1600);
        }, k*28);
      })(k);
    }
  }

  function playChime(){
    try{
      var Ctx = window.AudioContext || window.webkitAudioContext;
      var actx = new Ctx();
      var notes = [1046.5, 1318.5, 1568.0, 2093.0];
      for (var i = 0; i < notes.length; i++){
        (function(i){
          var t0 = actx.currentTime + i*0.11;
          var osc = actx.createOscillator();
          var gain = actx.createGain();
          osc.type = 'sine';
          osc.frequency.setValueAtTime(notes[i], t0);
          gain.gain.setValueAtTime(0, t0);
          gain.gain.linearRampToValueAtTime(0.07, t0+0.02);
          gain.gain.exponentialRampToValueAtTime(0.0001, t0+0.7);
          osc.connect(gain); gain.connect(actx.destination);
          osc.start(t0); osc.stop(t0+0.75);
        })(i);
      }
      setTimeout(function(){ actx.close(); }, 1500);
    }catch(e){}
  }

  // Only start hidden song after the mirror is fully cleaned
  var audio = document.getElementById('bg-music');
  var btn = document.getElementById('music-btn');
  var storageKey = 'dimple_music_muted';
  var muted = localStorage.getItem(storageKey) === 'true';
  var revealMusicStarted = false;

  function updateIcon(){
    btn.textContent = muted ? '🔇' : '🔊';
  }

  function playHiddenSong(){
    if (muted || revealMusicStarted) return;
    revealMusicStarted = true;
    audio.currentTime = 0;
    audio.play().catch(function(){});
  }

  function stopHiddenSong(){
    audio.pause();
  }

  audio.muted = false;
  updateIcon();

  btn.addEventListener('click', function(){
    muted = !muted;
    localStorage.setItem(storageKey, muted);

    if (muted) {
      stopHiddenSong();
    } else if (revealMusicStarted) {
      audio.play().catch(function(){});
    }

    updateIcon();
  });

  try{ localStorage.setItem('dimple_hidden_seen', 'true'); }catch(e){}

  // ================= Navigation =================
  document.getElementById('back-btn').addEventListener('click', function(){
    window.location.href = 'video.html';
  });
  document.getElementById('continue-btn').addEventListener('click', function(){
    window.location.href = 'apology.html';
  });
})();
</script></body>
</html>
