<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
        content="width=device-width, initial-scale=1.0, viewport-fit=cover">

    <meta name="theme-color" content="#F8FBFF">

    <title>For My Dimple Di ❤️</title>

    <meta name="description"
        content="A special memory journey created for Dimple Di.">

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">

    <link rel="preconnect"
        href="https://fonts.gstatic.com"
        crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&family=Playfair+Display:wght@600;700&family=Caveat:wght@500;700&display=swap"
        rel="stylesheet">

    <!-- CSS -->
    <link rel="stylesheet" href="style.css">

    <link rel="stylesheet" href="animations.css">

</head>

<body>

    <!-- ==========================
         Loading Screen
    =========================== -->

    <main
        id="loading-screen"
        class="page">

        <!-- Background -->

        <div class="bg-layer">

            <div class="bg-gradient"></div>

            <div class="blur-circle one"></div>

            <div class="blur-circle two"></div>

        </div>

        <!-- Main Container -->

        <section
            class="container text-center">
                      <!-- Illustration -->

            <div class="loader-wrap">

                <img
                    src="loading.svg"
                    alt="Loading Illustration"
                    class="loading-illustration">

                <h1 class="title">
                    For My Dimple Di
                </h1>

                <p class="subtitle">
                    A small journey made with love and respect.
                </p>

                <!-- Loader -->

                <div
                    id="loader"
                    class="loader">
                </div>

                <!-- Progress -->

                <div class="progress-container">

                    <div class="progress-track">

                        <div
                            id="progress-fill"
                            class="progress-fill">
                        </div>

                    </div>

                </div>

                <!-- Percentage -->

                <p
                    id="progress-text"
                    class="loading-text">

                    0%

                </p>

                <!-- Footer -->

                <p class="loading-footer">

                    Preparing your memories...

                </p>

            </div>

        </section>
                <!-- Floating Decorations -->

        <div class="float-item flower-1"></div>
        <div class="float-item flower-2"></div>
        <div class="float-item star-1"></div>
        <div class="float-item star-2"></div>

    </main>

    <!-- JavaScript -->

    <script src="app.js"></script>

</body>

</html>
