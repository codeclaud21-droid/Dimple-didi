<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#FFEDE6">
<title>Apology | For My Dimple Di ❤️</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&family=Playfair+Display:wght@600;700&family=Caveat:wght@500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="css/animations.css">
<style>
  /* ============ Apology — 4-Scene Scroll Story ============ */
  html, body{ overscroll-behavior-y: none; }

  #apology-page{
    position: relative;
    height: 100vh;
    height: 100dvh;
    overflow: hidden;
    background: #FFF3EE;
  }

  #scroll-track{
    position: absolute;
    inset: 0;
    overflow-y: auto;
    overflow-x: hidden;
    scroll-snap-type: y mandatory;
    -webkit-overflow-scrolling: touch;
  }

  .scene{
    position: relative;
    height: 100vh;
    height: 100dvh;
    width: 100%;
    scroll-snap-align: start;
    scroll-snap-stop: always;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 0 30px;
    text-align: center;
    overflow: hidden;
  }

  .scene-1{ background: radial-gradient(ellipse at 30% 20%, rgba(255,214,201,0.9) 0%, rgba(255,243,238,0) 55%), linear-gradient(160deg, #FFF6F1 0%, #FFEBE1 100%); }
  .scene-2{ background: radial-gradient(ellipse at 70% 25%, rgba(255,196,214,0.85) 0%, rgba(255,240,238,0) 55%), linear-gradient(160deg, #FFF0EC 0%, #FFE1EA 100%); }
  .scene-3{ background: radial-gradient(ellipse at 50% 40%, rgba(255,175,205,0.85) 0%, rgba(255,236,232,0) 60%), linear-gradient(160deg, #FFE9EE 0%, #FFD3E1 100%); }
  .scene-4{ background: radial-gradient(ellipse at 40% 70%, rgba(255,214,201,0.8) 0%, rgba(255,243,238,0) 55%), linear-gradient(160deg, #FFF6F1 0%, #FFE7DE 100%); }

  .scene-blur{
    position: absolute;
    border-radius: 50%;
    filter: blur(50px);
    opacity: 0.5;
    z-index: 0;
    animation: pulseSoft 7s ease-in-out infinite;
  }
  .scene-blur.a{ width: 58vw; height: 58vw; top: -16vw; left: -14vw; background: radial-gradient(circle, #FFD6C9 0%, rgba(255,214,201,0) 70%); }
  .scene-blur.b{ width: 54vw; height: 54vw; bottom: -14vw; right: -12vw; background: radial-gradient(circle, #FFC1D9 0%, rgba(255,193,217,0) 70%); animation-delay: 1.2s; }

  /* fixed chrome sits above the scroll track, giving a natural parallax feel
     since scene backgrounds slide underneath it */
  .apology-topbar{
    position: fixed;
    top: 0; left: 0; right: 0;
    z-index: 60;
  }
  .apology-topbar .icon-btn svg path{ stroke:#7A4A5C; }
  .apology-topbar #music-btn{ color:#7A4A5C; }

  /* ambient floating particles — fixed layer, drifts continuously behind topbar */
  #particle-layer{
    position: fixed;
    inset: 0;
    z-index: 3;
    pointer-events: none;
    overflow: hidden;
  }
  .petal{
    position: absolute;
    bottom: -40px;
    font-size: 14px;
    opacity: 0;
    animation-name: petalRise;
    animation-timing-function: ease-in;
    animation-iteration-count: infinite;
  }
  @keyframes petalRise{
    0%{ transform: translateY(0) translateX(0) rotate(0deg); opacity:0; }
    10%{ opacity: 0.75; }
    90%{ opacity: 0.55; }
    100%{ transform: translateY(-115vh) translateX(var(--drift,20px)) rotate(200deg); opacity:0; }
  }

  /* scroll hint */
  .scroll-hint{
    position: absolute;
    bottom: 26px;
    left: 0; right: 0;
    display: flex;
    justify-content: center;
    z-index: 10;
    color: #B8798F;
    animation: hintBounce 1.8s ease-in-out infinite;
    opacity: 0.8;
  }
  @keyframes hintBounce{
    0%,100%{ transform: translateY(0); }
    50%{ transform: translateY(8px); }
  }

  /* ---- Scene 1: Opening ---- */
  .char-wrap{
    position: relative;
    width: clamp(148px, 40vw, 185px);
    margin-bottom: 24px;
    z-index: 2;
    animation: charBreathe 4.2s ease-in-out infinite;
  }
  @keyframes charBreathe{
    0%,100%{ transform: translateY(0) scale(1); }
    50%{ transform: translateY(-7px) scale(1.025); }
  }
  .char-glow{
    position: absolute;
    inset: -18%;
    border-radius: 50%;
    background: radial-gradient(circle, rgba(255,214,236,0.75) 0%, rgba(255,214,236,0) 70%);
    filter: blur(14px);
    z-index: 0;
    animation: pulseSoft 4.2s ease-in-out infinite;
  }
  .char-wrap img{
    position: relative;
    z-index: 1;
    width: 100%;
    display: block;
    filter: drop-shadow(0 10px 24px rgba(120,60,90,0.18));
  }
  .scene1-line{
    position: relative;
    z-index: 2;
    font-family: var(--font-emotion, 'Caveat', cursive);
    font-size: clamp(22px, 6.5vw, 29px);
    color: #7A4A5C;
    opacity: 0;
    transform: translateY(10px);
    transition: opacity 1s ease, transform 1s ease;
  }
  .scene1-line.show{ opacity: 1; transform: translateY(0); }

  /* ---- Scene 2: Reflection (glass cards) ---- */
  .reflect-stack{
    position: relative;
    z-index: 2;
    width: 100%;
    max-width: 340px;
    display: flex;
    flex-direction: column;
    gap: 16px;
  }
  .glass-card{
    background: rgba(255,255,255,0.55);
    backdrop-filter: blur(14px);
    -webkit-backdrop-filter: blur(14px);
    border: 1px solid rgba(255,255,255,0.6);
    border-radius: 20px;
    padding: 18px 20px;
    box-shadow: 0 10px 28px rgba(150,80,100,0.12);
    font-family: 'Poppins', sans-serif;
    font-weight: 400;
    font-size: 15.5px;
    line-height: 1.55;
    color: #6B4457;
    opacity: 0;
    transform: translateY(18px) scale(0.97);
    transition: opacity 0.8s ease, transform 0.8s cubic-bezier(.22,.9,.34,1);
  }
  .glass-card.show{ opacity: 1; transform: translateY(0) scale(1); }

  /* ---- Scene 3: Climax — SORRY reveal ---- */
  .climax-wrap{
    position: relative;
    z-index: 2;
    display: flex;
    flex-direction: column;
    align-items: center;
  }
  .sorry-text{
    font-family: 'Playfair Display', serif;
    font-weight: 700;
    font-size: clamp(56px, 20vw, 92px);
    line-height: 1;
    background: linear-gradient(135deg, #FF8FB4, #FFB199 60%, #FFD37A);
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
    opacity: 0;
    transform: scale(0.7);
    filter: blur(6px);
    transition: opacity 1.3s cubic-bezier(.19,1,.22,1), transform 1.3s cubic-bezier(.19,1,.22,1), filter 1.3s ease;
    text-shadow: 0 0 40px rgba(255,150,180,0.35);
  }
  .sorry-text.reveal{
    opacity: 1;
    transform: scale(1);
    filter: blur(0);
  }
  .sorry-sub{
    margin-top: 10px;
    font-family: var(--font-emotion, 'Caveat', cursive);
    font-size: clamp(20px, 5.5vw, 26px);
    color: #A85A78;
    opacity: 0;
    transition: opacity 1s ease 0.6s;
  }
  .sorry-sub.reveal{ opacity: 1; }
  .climax-char{
    width: clamp(96px, 26vw, 120px);
    margin-top: 22px;
    opacity: 0;
    transform: translateY(14px);
    transition: opacity 1.1s ease 0.9s, transform 1.1s ease 0.9s;
    filter: drop-shadow(0 8px 18px rgba(150,60,90,0.2));
  }
  .climax-char.reveal{ opacity: 1; transform: translateY(0); }

  /* ---- Scene 4: Closing ---- */
  .closing-line{
    position: relative;
    z-index: 2;
    font-family: var(--font-emotion, 'Caveat', cursive);
    font-size: clamp(22px, 6vw, 28px);
    color: #7A4A5C;
    max-width: 320px;
    opacity: 0;
    transform: translateY(12px);
    transition: opacity 0.9s ease, transform 0.9s ease;
  }
  .closing-line.show{ opacity: 1; transform: translateY(0); }
  .apology-continue-wrap{
    position: relative;
    z-index: 2;
    margin-top: 26px;
    opacity: 0;
    transform: translateY(10px);
    pointer-events: none;
    transition: opacity 0.9s ease, transform 0.9s ease;
  }
  .apology-continue-wrap.show{
    opacity: 1;
    transform: translateY(0);
    pointer-events: auto;
  }
  .apology-continue-wrap #continue-btn{
    background: linear-gradient(135deg, #FFB199, #FF8FB4);
    color: #fff;
    border: none;
    box-shadow: 0 10px 26px rgba(255,120,160,0.38), 0 2px 0 rgba(255,255,255,0.4) inset;
    text-shadow: 0 1px 3px rgba(150,40,80,0.25);
  }
  .apology-continue-wrap #continue-btn:active{
    transform: scale(0.97);
  }
</style>
</head>
<body>
<main id="apology-page" class="page">

  <div class="apology-topbar top-bar">
    <button id="back-btn" class="icon-btn" aria-label="Back">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none">
        <path d="M15 18l-6-6 6-6" stroke="#7A4A5C" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
    </button>
    <button id="music-btn" class="icon-btn" aria-label="Toggle Music">🔊</button>
  </div>

  <div id="particle-layer"></div>

  <div id="scroll-track">

    <!-- Scene 1 — Opening -->
    <section class="scene scene-1" data-scene="1">
      <div class="scene-blur a"></div>
      <div class="scene-blur b"></div>
      <div class="char-wrap">
        <div class="char-glow"></div>
        <img src="assets/illustrations/apology-character.png" alt="" onerror="this.style.opacity=0;">
      </div>
      <p class="scene1-line" id="scene1-line">Kuch baatein hain jo apko kehni thi...</p>
      <div class="scroll-hint">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none"><path d="M6 9l6 6 6-6" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </div>
    </section>

    <!-- Scene 2 — Reflection -->
    <section class="scene scene-2" data-scene="2">
      <div class="scene-blur a"></div>
      <div class="scene-blur b"></div>
      <div class="reflect-stack">
        <div class="glass-card" data-card="0">Mujhe pata hai, kabhi kabhi main galat bol jaata hoon.</div>
        <div class="glass-card" data-card="1">Par tumhe hurt karna kabhi mera irada nahi tha.</div>
      </div>
      <div class="scroll-hint">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none"><path d="M6 9l6 6 6-6" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </div>
    </section>

    <!-- Scene 3 — Climax: SORRY -->
    <section class="scene scene-3" data-scene="3">
      <div class="scene-blur a"></div>
      <div class="scene-blur b"></div>
      <div class="climax-wrap">
        <div class="sorry-text" id="sorry-text">Sorry</div>
        <div class="sorry-sub" id="sorry-sub">Dimple Di 💗</div>
        <img class="climax-char" id="climax-char" src="assets/illustrations/apology-character.png" alt="" onerror="this.style.opacity=0;">
      </div>
      <div class="scroll-hint">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none"><path d="M6 9l6 6 6-6" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </div>
    </section>

    <!-- Scene 4 — Closing -->
    <section class="scene scene-4" data-scene="4">
      <div class="scene-blur a"></div>
      <div class="scene-blur b"></div>
      <p class="closing-line" id="closing-line">Bas itna hi kehna tha... shukriya sunne ke liye.</p>
      <div class="apology-continue-wrap" id="continue-wrap">
        <button id="continue-btn" class="primary-btn">Aage Badhiye</button>
      </div>
    </section>

  </div>

</main>

<audio id="bg-music" src="assets/music/apology.mp3" loop></audio>
<script src="js/app.js"></script>
<script>
(function(){
  // ================= Ambient floating particles =================
  var particleLayer = document.getElementById('particle-layer');
  var petals = ['🌸','💗','🌷','✨'];
  var PARTICLE_COUNT = 12;
  for (var i = 0; i < PARTICLE_COUNT; i++){
    var p = document.createElement('div');
    p.className = 'petal';
    p.textContent = petals[Math.floor(Math.random()*petals.length)];
    var left = Math.random()*100;
    var duration = 9 + Math.random()*7;
    var delay = Math.random()*10;
    var drift = (Math.random()*60 - 30) + 'px';
    p.style.left = left + 'vw';
    p.style.setProperty('--drift', drift);
    p.style.animationDuration = duration + 's';
    p.style.animationDelay = delay + 's';
    particleLayer.appendChild(p);
  }

  // ================= Scene-triggered reveals =================
  function once(el, cb){
    var obs = new IntersectionObserver(function(entries){
      entries.forEach(function(entry){
        if (entry.isIntersecting){
          cb();
          obs.unobserve(entry.target);
        }
      });
    }, { threshold: 0.55 });
    obs.observe(el);
  }

  // Scene 1
  once(document.querySelector('.scene-1'), function(){
    setTimeout(function(){
      document.getElementById('scene1-line').classList.add('show');
    }, 500);
  });

  // Scene 2 — sequential glass cards
  once(document.querySelector('.scene-2'), function(){
    var cards = document.querySelectorAll('.glass-card');
    cards.forEach(function(card, idx){
      setTimeout(function(){
        card.classList.add('show');
      }, 400 + idx * 550);
    });
  });

  // Scene 3 — the SORRY climax
  once(document.querySelector('.scene-3'), function(){
    setTimeout(function(){
      document.getElementById('sorry-text').classList.add('reveal');
      document.getElementById('sorry-sub').classList.add('reveal');
      document.getElementById('climax-char').classList.add('reveal');
      playChime();
      try{
        if (navigator.vibrate) navigator.vibrate([40,30,40]);
      }catch(e){}
    }, 350);
  });

  // Scene 4 — closing
  once(document.querySelector('.scene-4'), function(){
    setTimeout(function(){
      document.getElementById('closing-line').classList.add('show');
    }, 350);
    setTimeout(function(){
      document.getElementById('continue-wrap').classList.add('show');
    }, 1400);
  });

  // ================= Soft chime for the SORRY reveal =================
  function playChime(){
    try{
      var Ctx = window.AudioContext || window.webkitAudioContext;
      var ctx2 = new Ctx();
      var notes = [523.25, 659.25, 783.99, 1046.50]; // C5 E5 G5 C6
      notes.forEach(function(freq, i){
        var t0 = ctx2.currentTime + i * 0.11;
        var osc = ctx2.createOscillator();
        var gain = ctx2.createGain();
        osc.type = 'sine';
        osc.frequency.setValueAtTime(freq, t0);
        gain.gain.setValueAtTime(0.0001, t0);
        gain.gain.exponentialRampToValueAtTime(0.09, t0 + 0.05);
        gain.gain.exponentialRampToValueAtTime(0.0001, t0 + 0.9);
        osc.connect(gain);
        gain.connect(ctx2.destination);
        osc.start(t0);
        osc.stop(t0 + 1);
      });
      setTimeout(function(){ ctx2.close(); }, 1800);
    }catch(e){}
  }

  // ================= Music toggle (standard pattern) =================
  var audio = document.getElementById('bg-music');
  var btn = document.getElementById('music-btn');
  var storageKey = 'dimple_music_muted';
  var muted = localStorage.getItem(storageKey) === 'true';

  function updateIcon(){ btn.textContent = muted ? '🔇' : '🔊'; }
  function tryPlay(){ if (!muted) { audio.play().catch(function(){}); } }

  audio.muted = muted;
  updateIcon();
  tryPlay();

  btn.addEventListener('click', function(){
    muted = !muted;
    audio.muted = muted;
    localStorage.setItem(storageKey, muted);
    if (!muted) { audio.play().catch(function(){}); }
    updateIcon();
  });

  document.addEventListener('pointerdown', function firstInteract(){
    tryPlay();
    document.removeEventListener('pointerdown', firstInteract, true);
  }, { once: true, capture: true });

  // ================= Navigation =================
  document.getElementById('back-btn').addEventListener('click', function(){
    window.location.href = 'hidden.html';
  });
  document.getElementById('continue-btn').addEventListener('click', function(){
    window.location.href = 'end.html';
  });
})();
</script>
</body>
</html>
