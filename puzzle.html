<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
        content="width=device-width, initial-scale=1.0, viewport-fit=cover">

    <meta name="theme-color" content="#F8FBFF">

    <title>Puzzle | For My Dimple Di ❤️</title>

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">

    <link rel="preconnect"
        href="https://fonts.gstatic.com"
        crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&family=Playfair+Display:wght@600;700&family=Caveat:wght@500;700&display=swap"
        rel="stylesheet">

    <!-- CSS -->
    <link rel="stylesheet" href="css/style.css">

    <link rel="stylesheet" href="css/animations.css">

    <!-- Page-specific styles -->
    <style>

        /* ---- Heart Puzzle Stage ---- */

        .heart-stage{
            position:relative;
            width:100%;
            max-width:320px;
            margin:18px auto 8px;
        }

        #heart-svg{
            width:100%;
            height:auto;
            display:block;
            overflow:visible;
        }

        .heart-line{
            fill:none;
            stroke:url(#lineGrad);
            stroke-width:3;
            stroke-linecap:round;
            transition:stroke-dashoffset .5s ease;
        }

        .heart-fill{
            fill:url(#fillGrad);
            opacity:0;
            transition:opacity 1.1s ease;
        }

        .heart-fill.show{
            opacity:.9;
        }

        .dot-hit{
            fill:transparent;
            cursor:pointer;
        }

        .dot-circle{
            fill:rgba(255,255,255,.55);
            stroke:rgba(126,200,255,.9);
            stroke-width:2.4;
            transition:.25s ease;
        }

        .dot-circle.done{
            fill:var(--primary);
            stroke:var(--accent);
        }

        .dot-circle.wrong{
            fill:#ffb3c1;
            stroke:#ff6f91;
        }

        .dot-label{
            font-family:var(--font-body);
            font-size:11px;
            font-weight:700;
            fill:var(--text);
            pointer-events:none;
            text-anchor:middle;
            dominant-baseline:central;
        }

        .dot-label.done{
            fill:#fff;
        }

        .heart-message{
            position:absolute;
            top:52%;
            left:50%;
            transform:translate(-50%,-50%);
            font-family:var(--font-emotion);
            font-size:22px;
            color:#fff;
            text-shadow:0 2px 10px rgba(126,60,120,.35);
            opacity:0;
            transition:opacity 1s ease .3s;
            text-align:center;
            width:70%;
            pointer-events:none;
        }

        .heart-message.show{
            opacity:1;
        }

        #puzzle-status{
            min-height:24px;
            margin-top:4px;
            font-size:15px;
            color:var(--text-light);
        }

        #puzzle-status.solved{
            color:#4CAF8A;
            font-weight:600;
        }

        /* ---- Celebration Burst ---- */

        .celebration-layer{
            position:fixed;
            inset:0;
            pointer-events:none;
            overflow:hidden;
            z-index:50;
        }

        .confetti-piece{
            position:absolute;
            left:50%;
            top:42%;
            opacity:0;
            animation-name:confettiBurst;
            animation-timing-function:cubic-bezier(.2,.7,.3,1);
            animation-fill-mode:forwards;
        }

        @keyframes confettiBurst{
            0%{
                transform:translate(-50%,-50%) scale(.3) rotate(0deg);
                opacity:1;
            }
            60%{
                opacity:1;
            }
            100%{
                transform:translate(calc(-50% + var(--tx)), calc(-50% + var(--ty))) scale(1) rotate(var(--rot));
                opacity:0;
            }
        }

    </style>

</head>

<body>

    <!-- ==========================
         Puzzle Screen — Heart Connect-the-Dots
    =========================== -->

    <main
        id="puzzle-page"
        class="page">

        <!-- Background -->

        <div class="bg-layer">

            <div class="bg-gradient"></div>

            <div class="blur-circle one"></div>

            <div class="blur-circle two"></div>

        </div>

        <!-- Top Bar: Back + Music -->

        <div class="top-bar">

            <button
                id="back-btn"
                class="icon-btn"
                aria-label="Back">

                <svg width="20" height="20" viewBox="0 0 24 24" fill="none">
                    <path d="M15 18l-6-6 6-6" stroke="#2C2C2C" stroke-width="2"
                        stroke-linecap="round" stroke-linejoin="round"/>
                </svg>

            </button>

            <button
                id="music-btn"
                class="icon-btn"
                aria-label="Toggle Music">

                🔊

            </button>

        </div>

        <!-- Main Container -->

        <section class="container text-center">

            <h1 class="title anim-fade-in-down">
                Ek Dil Banao 💗
            </h1>

            <p class="subtitle anim-fade-in-up">
                Dots ko 1 se lekar aakhri number tak sahi tarteeb me tap karo.
            </p>

            <!-- Heart Puzzle Stage -->
            <div class="heart-stage">

                <svg id="heart-svg" viewBox="0 0 300 320">

                    <defs>

                        <linearGradient id="lineGrad" x1="0%" y1="0%" x2="100%" y2="100%">
                            <stop offset="0%" stop-color="#7EC8FF"/>
                            <stop offset="100%" stop-color="#CDB8FF"/>
                        </linearGradient>

                        <linearGradient id="fillGrad" x1="0%" y1="0%" x2="100%" y2="100%">
                            <stop offset="0%" stop-color="#7EC8FF"/>
                            <stop offset="100%" stop-color="#F4A6C8"/>
                        </linearGradient>

                    </defs>

                    <!-- Filled heart, revealed once solved -->
                    <path id="heart-fill" class="heart-fill"></path>

                    <!-- Connecting lines drawn as user solves -->
                    <g id="lines-group"></g>

                    <!-- Dots + numbers, added by JS -->
                    <g id="dots-group"></g>

                </svg>

                <div id="heart-message" class="heart-message">Dimple Didi 💗</div>

            </div>

            <p id="puzzle-status"></p>

            <button
                id="continue-btn"
                class="primary-btn mt-3"
                disabled>

                Aage Badhiye

            </button>

        </section>

        <!-- Celebration Burst Overlay -->
        <div id="celebration-layer" class="celebration-layer"></div>

        <!-- Floating Decorations -->

        <div class="float-item flower-1"></div>
        <div class="float-item flower-2"></div>
        <div class="float-item star-1"></div>
        <div class="float-item star-2"></div>

    </main>

    <!-- Background Music (add actual file at assets/music/puzzle.mp3) -->
    <audio id="bg-music" src="assets/music/puzzle.mp3" loop></audio>

    <!-- Shared JS -->
    <script src="js/app.js"></script>

    <script>

        // ==========================
        // Heart Connect-the-Dots Puzzle
        // ==========================
        (function () {

            // Points traced along a mathematical heart curve, in perimeter order.
            var POINTS = [
                { n: 1,  x: 150.0, y: 102.5 },
                { n: 2,  x: 162.4, y: 70.5  },
                { n: 3,  x: 222.6, y: 36.8  },
                { n: 4,  x: 290.9, y: 73.8  },
                { n: 5,  x: 290.9, y: 152.5 },
                { n: 6,  x: 222.6, y: 225.0 },
                { n: 7,  x: 162.4, y: 284.5 },
                { n: 8,  x: 150.0, y: 311.5 },
                { n: 9,  x: 137.6, y: 284.5 },
                { n: 10, x: 77.4,  y: 225.0 },
                { n: 11, x: 9.1,   y: 152.5 },
                { n: 12, x: 9.1,   y: 73.8  },
                { n: 13, x: 77.4,  y: 36.8  },
                { n: 14, x: 137.6, y: 70.5  }
            ];

            var dotsGroup = document.getElementById('dots-group');
            var linesGroup = document.getElementById('lines-group');
            var heartFill = document.getElementById('heart-fill');
            var heartMessage = document.getElementById('heart-message');
            var statusEl = document.getElementById('puzzle-status');
            var continueBtn = document.getElementById('continue-btn');

            var nextExpected = 1;
            var dotEls = {};

            var SVG_NS = 'http://www.w3.org/2000/svg';

            function renderDots() {

                POINTS.forEach(function (p) {

                    var hit = document.createElementNS(SVG_NS, 'circle');
                    hit.setAttribute('cx', p.x);
                    hit.setAttribute('cy', p.y);
                    hit.setAttribute('r', 15);
                    hit.setAttribute('class', 'dot-hit');

                    var circle = document.createElementNS(SVG_NS, 'circle');
                    circle.setAttribute('cx', p.x);
                    circle.setAttribute('cy', p.y);
                    circle.setAttribute('r', 10);
                    circle.setAttribute('class', 'dot-circle');

                    var label = document.createElementNS(SVG_NS, 'text');
                    label.setAttribute('x', p.x);
                    label.setAttribute('y', p.y);
                    label.setAttribute('class', 'dot-label');
                    label.textContent = p.n;

                    hit.addEventListener('click', function () {
                        handleTap(p.n, circle, label);
                    });

                    dotsGroup.appendChild(circle);
                    dotsGroup.appendChild(label);
                    dotsGroup.appendChild(hit);

                    dotEls[p.n] = { circle: circle, label: label };
                });
            }

            function drawLine(fromPoint, toPoint) {

                var line = document.createElementNS(SVG_NS, 'line');
                var length = Math.hypot(toPoint.x - fromPoint.x, toPoint.y - fromPoint.y);

                line.setAttribute('x1', fromPoint.x);
                line.setAttribute('y1', fromPoint.y);
                line.setAttribute('x2', toPoint.x);
                line.setAttribute('y2', toPoint.y);
                line.setAttribute('class', 'heart-line');
                line.style.strokeDasharray = length;
                line.style.strokeDashoffset = length;

                linesGroup.appendChild(line);

                // trigger the draw-in transition
                requestAnimationFrame(function () {
                    line.style.strokeDashoffset = 0;
                });
            }

            function handleTap(n, circle, label) {

                if (n !== nextExpected) {

                    circle.classList.add('wrong');
                    setTimeout(function () {
                        circle.classList.remove('wrong');
                    }, 350);

                    return;
                }

                circle.classList.add('done');
                label.classList.add('done');

                if (nextExpected > 1) {
                    drawLine(POINTS[nextExpected - 2], POINTS[nextExpected - 1]);
                }

                nextExpected++;

                if (nextExpected > POINTS.length) {
                    finishHeart();
                }
            }

            function finishHeart() {

                // Close the loop back to the first point
                drawLine(POINTS[POINTS.length - 1], POINTS[0]);

                var d = 'M ' + POINTS.map(function (p) { return p.x + ' ' + p.y; }).join(' L ') + ' Z';
                heartFill.setAttribute('d', d);

                setTimeout(function () {
                    heartFill.classList.add('show');
                    heartMessage.classList.add('show');
                }, 500);

                statusEl.textContent = 'Shaandar! 💗';
                statusEl.classList.add('solved');

                setTimeout(celebrate, 700);

                setTimeout(function () {
                    continueBtn.disabled = false;
                    continueBtn.classList.add('anim-scale-in');
                }, 1500);
            }

            // ---- Celebration: sound + firework burst ----

            function playChime() {

                try {

                    var Ctx = window.AudioContext || window.webkitAudioContext;
                    var ctx = new Ctx();
                    var notes = [523.25, 659.25, 783.99, 1046.50];

                    notes.forEach(function (freq, i) {

                        var osc = ctx.createOscillator();
                        var gain = ctx.createGain();

                        osc.type = 'sine';
                        osc.frequency.value = freq;

                        osc.connect(gain);
                        gain.connect(ctx.destination);

                        var startTime = ctx.currentTime + i * 0.11;

                        gain.gain.setValueAtTime(0.0001, startTime);
                        gain.gain.exponentialRampToValueAtTime(0.28, startTime + 0.02);
                        gain.gain.exponentialRampToValueAtTime(0.0001, startTime + 0.45);

                        osc.start(startTime);
                        osc.stop(startTime + 0.5);
                    });

                } catch (e) {
                    // Web Audio not supported, fail silently
                }
            }

            function burstWave(count) {

                var layer = document.getElementById('celebration-layer');
                var pieces = ['💗', '🌸', '✨', '💫', '🌷', '🎉'];

                for (var i = 0; i < count; i++) {

                    var span = document.createElement('span');
                    span.className = 'confetti-piece';
                    span.textContent = pieces[Math.floor(Math.random() * pieces.length)];

                    var angle = Math.random() * Math.PI * 2;
                    var distance = 90 + Math.random() * 160;

                    span.style.setProperty('--tx', (Math.cos(angle) * distance) + 'px');
                    span.style.setProperty('--ty', (Math.sin(angle) * distance) + 'px');
                    span.style.setProperty('--rot', (Math.random() * 480 - 240) + 'deg');

                    span.style.fontSize = (16 + Math.random() * 16) + 'px';
                    span.style.animationDuration = (1.1 + Math.random() * 0.7) + 's';

                    layer.appendChild(span);
                }
            }

            function celebrate() {

                var layer = document.getElementById('celebration-layer');

                playChime();

                burstWave(24);
                setTimeout(function () { burstWave(20); }, 200);
                setTimeout(function () { burstWave(18); }, 420);

                setTimeout(function () {
                    layer.innerHTML = '';
                }, 2600);
            }

            // ---- Init ----
            renderDots();

            // ---- Navigation ----
            document.getElementById('back-btn').addEventListener('click', function () {
                window.location.href = 'welcome.html';
            });

            continueBtn.addEventListener('click', function () {
                window.location.href = 'gallery.html';
            });

        })();

        // ---- Music Toggle (mute state remembered across pages) ----
        (function () {

            var audio = document.getElementById('bg-music');
            var btn = document.getElementById('music-btn');
            var storageKey = 'dimple_music_muted';

            var muted = localStorage.getItem(storageKey) === 'true';

            function updateIcon() {
                btn.textContent = muted ? '🔇' : '🔊';
            }

            function tryPlay() {
                if (!muted) {
                    audio.play().catch(function () {});
                }
            }

            audio.muted = muted;
            updateIcon();
            tryPlay();

            btn.addEventListener('click', function () {
                muted = !muted;
                audio.muted = muted;
                localStorage.setItem(storageKey, muted);

                if (!muted) {
                    audio.play().catch(function () {});
                }

                updateIcon();
            });

            document.addEventListener('pointerdown', function firstInteract() {
                tryPlay();
                document.removeEventListener('pointerdown', firstInteract, true);
            }, { once: true, capture: true });

        })();

    </script>

</body>

</html>
